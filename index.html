<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENCORAM // SECURE NODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --amber: #ffcc00;
            --amber-dim: rgba(255, 204, 0, 0.3);
            --bg: #020205;
        }
        * { cursor: crosshair !important; }
        body {
            background-color: var(--bg);
            color: #d1d5db;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .syncopate { font-family: 'Syncopate', sans-serif; }
        
        /* Noise Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--amber); }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 100;
            background: linear-gradient(0deg, transparent 0%, rgba(255, 204, 0, 0.03) 50%, transparent 100%);
            position: fixed;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }
        .glitch-text::before { color: #0ff; z-index: -1; animation: glitch-1 2s infinite linear alternate-reverse; }
        .glitch-text::after { color: #f0f; z-index: -2; animation: glitch-2 2s infinite linear alternate-reverse; }

        @keyframes glitch-1 {
            0% { transform: translate(1px, 1px); }
            20% { transform: translate(-1px, -1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, 1px); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(-1px, -1px); }
        }
        @keyframes glitch-2 {
            0% { transform: translate(-1px, -1px); }
            20% { transform: translate(1px, 1px); }
            40% { transform: translate(-1px, 1px); }
            60% { transform: translate(1px, -1px); }
            80% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }
    </style>
